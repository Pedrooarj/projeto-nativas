name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — tipos e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      banco:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nativas
          POSTGRES_PASSWORD: nativas
          POSTGRES_DB: nativas
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U nativas -d nativas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nativas:nativas@localhost:5433/nativas?schema=public
      JWT_SECRET: apenas-para-o-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test

  web:
    name: Web — tipos e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
